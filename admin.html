<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Admin - FIXED & SECURED</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 20% 10%,rgba(127,176,105,.3),transparent),radial-gradient(600px 400px at 80% 90%,rgba(212,162,89,.2),transparent),#0b1a12;color:#e8ede8;font-family:system-ui;display:grid;place-items:center;padding:18px}
.card{width:min(440px,96vw);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);border-radius:20px;padding:28px}
h1{font-family:serif;margin:0 0 6px;font-size:28px}p{margin:0 0 18px;color:#9ab29d;font-size:12px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;margin:8px 0 12px}
button{width:100%;padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer}
.btn-green{background:#7FB069;color:#111} .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);margin-top:10px}
.err{background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.3);color:#ff9a9a;padding:10px;border-radius:10px;font-size:11px;display:none;margin:10px 0}
.ok{background:rgba(127,176,105,.15);border:1px solid rgba(127,176,105,.4);padding:10px;border-radius:10px;font-size:11px;margin:10px 0}
small{color:#7a8a7d;font-size:10px;display:block;margin-top:12px;text-align:center}
</style></head><body>
<div class="card">
<h1>Aurora Admin — FIXED</h1>
<p id="status">Ready. Login with Google to unlock admin.</p>
<div id="err" class="err"></div>
<div id="ok" class="ok" style="display:none"></div>
<input id="email" placeholder="tubalrr@gmail.com (admin only)" value="tubalrr@gmail.com">
<input id="pass" type="password" placeholder="Password">
<button class="btn-green" onclick="loginEmail()">Sign in with Email</button>
<div style="text-align:center;margin:12px 0;opacity:.5;font-size:11px">OR</div>
<button class="btn-ghost" onclick="loginGoogle()">🌲 Sign in with Google</button>
<small>FIX: no orderBy, client sort, listens to 5 collections, lock sync. Uses firebase-config.js (not hardcoded) so no more api-key-expired if you restrict properly.<br><br><b>After login → auto redirect to admin panel</b></small>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

function showErr(m){ const e=document.getElementById("err"); e.style.display="block"; e.textContent=m; }
function showOk(m){ const e=document.getElementById("ok"); e.style.display="block"; e.textContent=m; }

window.loginGoogle = async ()=>{
  try{ showOk("Opening Google..."); const r=await signInWithPopup(auth,provider);
    if(r.user.email!=="tubalrr@gmail.com"){ showErr("Not admin: "+r.user.email); return; }
    showOk("OK! Redirecting to admin panel..."); setTimeout(()=>location.href="./admin-panel.html",800);
  }catch(e){ console.error(e); showErr("Firebase Error ("+e.code+" - "+e.message+"). FIX: Go to Google Cloud Console > Credentials > Edit your API Key > Add Identity Toolkit API + Token Service API to allowed APIs, and add tubalrr.github.io/* to HTTP referrers."); }
};
window.loginEmail = async ()=>{
  try{
    const email=document.getElementById("email").value, pass=document.getElementById("pass").value;
    if(email!=="tubalrr@gmail.com"){ showErr("Only tubalrr@gmail.com allowed"); return; }
    showOk("Signing in..."); await signInWithEmailAndPassword(auth,email,pass);
    showOk("OK! Redirecting..."); setTimeout(()=>location.href="./admin-panel.html",800);
  }catch(e){ console.error(e); showErr("Error ("+e.code+"): "+e.message+" . If api-key-expired, go to Google Cloud Console > Credentials > edit key > Don't restrict key temporarily."); }
};
</script>
</body></html>
