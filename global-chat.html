<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payapang Isip • Global Chat</title>
<style>
:root{
  --ink:#18342b;--paper:#f5f0e6;--card:#fffdf8;
  --sage:#7f9b85;--line:#d9dfd4;--soft:#eef4ed;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:var(--ink);
background:linear-gradient(180deg,#eaf2ea,#f5f0e6);min-height:100vh}
header{background:rgba(255,253,248,.94);backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.nav{max-width:1100px;margin:auto;padding:14px 20px;display:flex;
justify-content:space-between;align-items:center;gap:15px}
.brand{font:700 22px Georgia,serif}.brand span{color:var(--sage)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;
cursor:pointer}.dark{background:var(--ink);color:#fff}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
main{max-width:900px;margin:auto;padding:28px 16px}
.hero{text-align:center;margin-bottom:20px}.hero h1{font:700 34px Georgia,serif;margin:0 0 8px}
.hero p{margin:0;color:#587064}
.chat{background:var(--card);border:1px solid var(--line);border-radius:24px;
overflow:hidden;box-shadow:0 15px 40px rgba(24,52,43,.08)}
.chat-head{padding:16px 20px;background:var(--soft);border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center}
.status{font-size:12px;color:#527260;font-weight:bold}.dot{display:inline-block;width:8px;height:8px;background:#4e9b68;border-radius:50%;margin-right:5px}
.messages{height:520px;overflow-y:auto;padding:20px;background:linear-gradient(#fffdf8,#f7fbf6)}
.message{margin:0 0 16px;max-width:78%}
.message.me{margin-left:auto;text-align:right}
.meta{font-size:11px;color:#7c8c84;margin-bottom:5px;font-weight:bold}
.bubble{display:inline-block;text-align:left;background:#edf4ed;padding:11px 14px;
border-radius:16px 16px 16px 4px;line-height:1.45;word-break:break-word}
.me .bubble{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px}
.empty{text-align:center;color:#84938b;padding:80px 10px}
.composer{padding:14px;border-top:1px solid var(--line);display:flex;gap:10px;background:#fffdf8}
.composer input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:999px;outline:none;font-size:14px}
.composer input:focus{border-color:var(--sage)}
.notice{padding:12px 16px;background:#fff4dc;border-bottom:1px solid #f0dcae;font-size:12px;text-align:center}
#loginNotice{display:none}
@media(max-width:600px){.messages{height:65vh}.hero h1{font-size:28px}.message{max-width:88%}.nav{padding:12px 14px}}
.emoji-choice{border:0;background:transparent;font-size:20px;padding:3px 4px;cursor:pointer}
.emoji-choice:hover{transform:scale(1.2)}
#chatToast{position:fixed;right:18px;bottom:18px;max-width:330px;background:#18342b;color:#fff;padding:13px 16px;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.2);display:none;z-index:9999;font-size:13px}
#chatToast.show{display:block;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}

</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">Payapang <span>Isip</span> 💬</div>
    <button class="btn light" onclick="location.href='index.html'">← Back to Home</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>🌍 Global Chat</h1>
    <p>Isang lugar para mag-usap ang buong Payapang Isip community.</p>
  </section>

  <section class="chat">
    <div class="chat-head">
      <strong>💬 Community Conversation</strong>
      <span class="status"><span class="dot"></span>LIVE</span>
    </div>

    <div id="loginNotice" class="notice">
      🔐 Kailangan mong mag-login sa Payapang Isip para makapag-send ng message.
    </div>

    <div id="messages" class="messages">
      <div class="empty">Loading conversations... 💬</div>
    </div>

    <div id="emojiBar" style="display:none;padding:8px 14px;background:#fffdf8;border-top:1px solid var(--line);font-size:20px;cursor:pointer;word-spacing:4px">
      <button type="button" class="emoji-choice">😊</button>
      <button type="button" class="emoji-choice">😂</button>
      <button type="button" class="emoji-choice">❤️</button>
      <button type="button" class="emoji-choice">👍</button>
      <button type="button" class="emoji-choice">👋</button>
      <button type="button" class="emoji-choice">🙏</button>
      <button type="button" class="emoji-choice">😍</button>
      <button type="button" class="emoji-choice">😢</button>
      <button type="button" class="emoji-choice">😮</button>
      <button type="button" class="emoji-choice">🎉</button>
      <button type="button" class="emoji-choice">🌿</button>
      <button type="button" class="emoji-choice">🍃</button>
      <button type="button" class="emoji-choice">🌲</button>
      <button type="button" class="emoji-choice">☀️</button>
      <button type="button" class="emoji-choice">💚</button>
      <button type="button" class="emoji-choice">✨</button>
      <button type="button" class="emoji-choice">🔥</button>
    </div>
    <div id="stickerBar" style="display:none;padding:8px 14px;background:#fffdf8;border-top:1px solid var(--line)">
      <button class="btn light sticker" type="button">🌿</button>
      <button class="btn light sticker" type="button">🍃</button>
      <button class="btn light sticker" type="button">🌲</button>
      <button class="btn light sticker" type="button">☀️</button>
      <button class="btn light sticker" type="button">💚</button>
      <button class="btn light sticker" type="button">✨</button>
      <button class="btn light sticker" type="button">🕊️</button>
      <button class="btn light sticker" type="button">🌈</button>
    </div>
    <form id="chatForm" class="composer">
      <button class="btn light" id="emojiBtn" type="button" title="Emoji">😊</button>
      <button class="btn light" id="stickerBtn" type="button" title="Sticker">🌿</button>
      <input id="messageInput" maxlength="500" placeholder="Type your message..." autocomplete="off">
      <button class="btn dark" type="submit">Send ➤</button>
    </form>
  </section>
</main>
<div id="chatToast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjYzrOvJuV1UN67aljAHQEK5LWCmtvMPw",
  authDomain: "payapang-isip.firebaseapp.com",
  projectId: "payapang-isip",
  storageBucket: "payapang-isip.firebasestorage.app",
  messagingSenderId: "901078398408",
  appId: "1:901078398408:web:1f4c5e5794f96801f57cfd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let lastMessageTime = 0;
let chatInitialized = false;
let seenMessageIds = new Set();
let unreadCount = 0;

const notifyBtn = document.getElementById("notifyBtn");
const chatToast = document.getElementById("chatToast");

function showChatToast(text){
  if(!chatToast) return;
  chatToast.textContent = text;
  chatToast.classList.add("show");
  clearTimeout(showChatToast.timer);
  showChatToast.timer = setTimeout(()=>chatToast.classList.remove("show"),4000);
}

async function requestChatNotifications(){
  if(!("Notification" in window)){
    showChatToast("Hindi supported ang browser notifications sa browser na ito.");
    return;
  }
  if(Notification.permission === "granted"){
    showChatToast("🔔 Notifications are already enabled.");
    return;
  }
  if(Notification.permission === "denied"){
    showChatToast("Naka-block ang notifications. I-enable ito sa browser site settings.");
    return;
  }
  const result = await Notification.requestPermission();
  showChatToast(result === "granted" ? "🔔 Notifications enabled!" : "Notifications not enabled.");
}

function notifyChat(title, body){
  unreadCount++;
  document.title = `(${unreadCount}) Payapang Isip • Global Chat`;
  showChatToast(`🔔 ${title}: ${body}`);
  if("Notification" in window && Notification.permission === "granted" && document.hidden){
    new Notification(title,{body,icon:"https://tubalrr.github.io/favicon.ico"});
  }
}

if(notifyBtn) notifyBtn.addEventListener("click",requestChatNotifications);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    unreadCount=0;
    document.title="Payapang Isip • Global Chat";
  }
});

const messagesEl = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const loginNotice = document.getElementById("loginNotice");

function escapeHTML(value){
  return String(value || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function formatTime(timestamp){
  if(!timestamp) return "Sending...";
  try{
    return timestamp.toDate().toLocaleString([],{
      month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"
    });
  }catch(e){ return ""; }
}

function renderMessage(id,data){
  const mine = currentUser && data.uid === currentUser.uid;
  const name = data.name || data.email || "Anonymous";
  return `
    <div class="message ${mine ? "me" : ""}" data-id="${escapeHTML(id)}">
      <div class="meta">${escapeHTML(mine ? "You" : name)} • ${formatTime(data.createdAt)}</div>
      <div class="bubble">${escapeHTML(data.text)}</div>
    </div>`;
}

const chatQuery = query(
  collection(db,"globalChats"),
  orderBy("createdAt","asc"),
  limit(100)
);

onSnapshot(chatQuery, snapshot => {
  if(!chatInitialized){
    snapshot.docs.forEach(d=>seenMessageIds.add(d.id));
    chatInitialized=true;
  }else{
    snapshot.docChanges().forEach(change=>{
      if(change.type==="added" && !seenMessageIds.has(change.doc.id)){
        const data=change.doc.data();
        const mine=currentUser && data.uid===currentUser.uid;
        if(!mine){
          const sender=data.isAdmin ? "Admin" : (data.name || data.email || "New message");
          notifyChat("New Global Chat message", `${sender}: ${String(data.text || "").slice(0,100)}`);
        }
        seenMessageIds.add(change.doc.id);
      }
    });
  }

  if(snapshot.empty){
    messagesEl.innerHTML = '<div class="empty">Wala pang message. Ikaw ang maunang bumati! 👋</div>';
    return;
  }
  messagesEl.innerHTML = snapshot.docs
    .map(doc => renderMessage(doc.id,doc.data()))
    .join("");
  messagesEl.scrollTop = messagesEl.scrollHeight;
}, error => {
  console.error(error);
  messagesEl.innerHTML = `<div class="empty">⚠️ Hindi ma-load ang chat.<br><small>Check Firestore Rules at index configuration.</small></div>`;
});

onAuthStateChanged(auth,user=>{
  currentUser=user;
  loginNotice.style.display=user ? "none" : "block";
  input.disabled=!user;
  const sendButton = form.querySelector('button[type="submit"]');
  if(sendButton) sendButton.disabled=!user;
  input.placeholder=user ? "Type your message..." : "Login required to chat";
});


document.getElementById("emojiBtn").addEventListener("click",()=>{
  const b=document.getElementById("emojiBar");
  document.getElementById("stickerBar").style.display="none";
  b.style.display=b.style.display==="none"?"block":"none";
});
document.getElementById("stickerBtn").addEventListener("click",()=>{
  const b=document.getElementById("stickerBar");
  document.getElementById("emojiBar").style.display="none";
  b.style.display=b.style.display==="none"?"block":"none";
});
document.querySelectorAll(".emoji-choice").forEach(btn=>btn.addEventListener("click",()=>{
  input.value += btn.textContent.trim();
  input.focus();
}));

document.querySelectorAll(".sticker").forEach(btn=>btn.addEventListener("click",()=>{
  if(!currentUser){
    alert("Please login first.");
    return;
  }
  input.value = btn.textContent.trim();
  form.requestSubmit();
}));

form.addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  const text=input.value.trim();
  if(!text) return;

  const now=Date.now();
  if(now-lastMessageTime<2000){
    alert("Please wait a moment before sending another message.");
    return;
  }

  lastMessageTime=now;
  input.disabled=true;

  try{
    await addDoc(collection(db,"globalChats"),{
      text:text,
      uid:currentUser.uid,
      email:currentUser.email || "",
      name:currentUser.displayName || currentUser.email?.split("@")[0] || "User",
      createdAt:serverTimestamp()
    });
    input.value="";
  }catch(error){
    console.error(error);
    alert("Hindi na-send ang message. Check Firebase Firestore Rules.");
  }finally{
    input.disabled=false;
    input.focus();
  }
});
</script>
</body>
</html>
