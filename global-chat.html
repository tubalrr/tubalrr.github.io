  e.stopPropagation();
  alert("\uD83D\uDD12 Global Chat is locked by Admin\\n\\nCommunity chat is paused for now. Please check back later. \uD83C\uDF32");
  return false;
}

function applyLockUI(locked){
  isChatLocked = locked;
  const globalLinks = document.querySelectorAll('a[href="global-chat.html"], a[href="./global-chat.html"], a[href="/global-chat.html"], [data-global-chat-link]');
  
  if(locked){
    if(banner) banner.classList.add("show");
    globalLinks.forEach(a=>{
      if(!a.dataset.orig){
        a.dataset.orig = a.innerHTML;
        a.dataset.origHref = a.getAttribute("href");
      }
      a.classList.add("locked");
      // Change text based on location
      if(a.closest(".nav-menu")){
        a.innerHTML = "\uD83D\uDD12 Global Chat Locked";
      } else if(a.closest(".destination-card")){
        a.innerHTML = "\uD83D\uDD12 Locked by Admin";
      }
      a.setAttribute("aria-disabled","true");
    });
    document.querySelectorAll("[data-global-chat-card]").forEach(c=> c.classList.add("locked"));
    // Add blocking listeners
    globalLinks.forEach(a=> a.addEventListener("click", blockClick, true));
  } else {
    if(banner) banner.classList.remove("show");
    globalLinks.forEach(a=>{
      a.classList.remove("locked");
      if(a.dataset.orig) a.innerHTML = a.dataset.orig;
      a.removeAttribute("aria-disabled");
      a.removeEventListener("click", blockClick, true);
    });
    document.querySelectorAll("[data-global-chat-card]").forEach(c=> c.classList.remove("locked"));
  }
}

function checkGlobalChatLock(){
  try{
    const lockRef = doc(db, "settings", "globalChat");
    onSnapshot(lockRef, (snap)=>{
      if(snap.exists()){
        const data = snap.data();
        console.log("[Payapang Isip] Global Chat lock status:", data);
        applyLockUI(data.locked === true);
      } else {
        applyLockUI(false);
      }
    }, (err)=>{
      console.warn("Failed to listen to globalChat lock:", err);
    });
  }catch(e){
    console.warn("Lock listener init failed:", e);
  }
}

// Start listening
checkGlobalChatLock();

// Expose for admin testing
window.checkGlobalChatLock = checkGlobalChatLock;
window.applyLockUI = applyLockUI;
