<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payapang Isip • News & Forest Whispers 🌲</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:#0B1A12;color:#E8EDE8;overflow-x:hidden}
.serif{font-family:Fraunces,serif}
.kain-top{position:fixed;top:0;left:0;right:0;z-index:100;height:70px;display:flex;align-items:center;padding:0 28px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.kain-top-inner{width:100%;max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.kain-brand{font-family:Fraunces,serif;font-size:21px;font-weight:900;color:#fff;text-decoration:none}.kain-brand span{color:#D4A259}
.kain-nav{display:flex;gap:20px}.kain-nav a{color:rgba(255,255,255,.75);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:.2s}
.kain-nav a:hover,.kain-nav a.active{color:#fff;border-bottom:1.5px solid #D4A259;padding-bottom:2px}
.btn-kain{border:0;border-radius:6px;padding:9px 14px;font-weight:800;font-size:11px;cursor:pointer}.btn-ghost{border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff}.btn-gold{background:#D4A259;color:#111}
.news-hero{position:relative;min-height:52vh;display:grid;place-items:center;background:#0D1E14;overflow:hidden;padding:110px 28px 40px}
.news-hero-bg{position:absolute;inset:0;background:radial-gradient(800px 500px at 30% 20%, rgba(212,162,89,.18), transparent 60%), radial-gradient(600px 400px at 80% 80%, rgba(45,90,61,.35), transparent 70%), linear-gradient(105deg,#0B1A12 0%, #122A1B 50%, #0D1E14 100%)}
.news-hero-bg:after{content:"";position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;opacity:.22;mix-blend-mode:overlay}
.news-hero-content{position:relative;z-index:2;text-align:center;max-width:720px}
.kicker{font-size:10px;letter-spacing:.32em;font-weight:800;color:#D4A259;text-transform:uppercase;margin-bottom:12px}
.news-hero h1{font-family:Fraunces,serif;font-size:clamp(36px,5vw,64px);line-height:.9;margin:0;color:#fff;font-weight:900}
.news-hero h1 span{color:#D4A259}
.news-hero p{margin:14px auto 0;max-width:520px;color:rgba(255,255,255,.7);font-size:13px;line-height:1.7}
.news-section{max-width:1400px;margin:0 auto;padding:28px;background:#F6F8F3;color:#1A2E22;min-height:60vh}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:20px}
.search-box{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid rgba(33,75,56,.12);border-radius:12px;padding:10px 14px;min-width:240px;flex:1;max-width:360px}
.search-box input{border:0;outline:0;width:100%;font-size:13px;background:transparent}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid rgba(33,75,56,.12);background:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
.chip.active{background:#1A2E22;color:#fff;border-color:#1A2E22}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1000px){.news-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.news-grid{grid-template-columns:1fr}.kain-nav{display:none}}
.news-card{background:#fff;border:1px solid rgba(33,75,56,.08);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.04);transition:.25s;cursor:pointer;position:relative}
.news-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.08)}
.news-thumb{width:100%;height:180px;object-fit:cover;background:linear-gradient(135deg,#FFF0DD,#EAF1EE);display:block}
.news-thumb-placeholder{width:100%;height:180px;background:linear-gradient(135deg,#1A2E22,#2D5A3D);display:grid;place-items:center;color:#D4A259;font-size:42px}
.news-body{padding:16px}
.news-meta{display:flex;gap:8px;align-items:center;font-size:10px;color:#8A96A4;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.06em;border:1px solid}
.badge-green{background:#E9F6EC;color:#2E8B4A;border-color:#D7ECD9}.badge-orange{background:#FFF3E8;color:#9A5A2A;border-color:#FFE0C0}
.news-card h3{font-family:Fraunces,serif;font-size:18px;line-height:1.2;margin:0 0 8px;color:#1A2E22}
.news-card p{font-size:12.5px;color:#6B8A7A;line-height:1.6;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:#8A96A4}
.news-foot b{color:#1A2E22}
.empty-news{text-align:center;padding:60px 20px;background:#fff;border:1.5px dashed rgba(33,75,56,.15);border-radius:18px}
.news-modal{position:fixed;inset:0;background:rgba(5,15,10,.72);backdrop-filter:blur(12px);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.news-modal.show{display:flex}
.news-modal-card{width:min(720px,96vw);max-height:90vh;overflow:auto;background:#FFFEFB;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop.3s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-thumb{width:100%;max-height:340px;object-fit:cover}
.modal-body{padding:22px}
.modal-close{position:sticky;top:0;float:right;border:1.5px solid rgba(33,75,56,.12);background:#fff;padding:8px 12px;border-radius:10px;font-weight:800;cursor:pointer;margin:10px;z-index:2}
</style>
</head>
<body>

<div class="kain-top">
  <div class="kain-top-inner">
    <a href="./index.html" class="kain-brand">PAYAPANG <span>&</span> ISIP.</a>
    <div class="kain-nav">
      <a href="./index.html">Home</a>
      <a href="./index.html#forest">Forest</a>
      <a href="./global-chat.html">Global Chat</a>
      <a href="./News.html" class="active">News</a>
      <a href="./shop.html">Shop</a>
    </div>
  </div>
</div>

<div class="news-hero">
  <div class="news-hero-bg"></div>
  <div class="news-hero-content">
    <div class="kicker">Forest Whispers • Live from Firestore</div>
    <h1>News & <span>Forest Whispers</span> 🌲</h1>
    <p>Payapang balita, healing tips, at community updates — live galing sa Admin Studio mo.</p>
  </div>
</div>

<div class="news-section">
  <div class="toolbar">
    <div class="search-box">🔍 <input id="searchInput" oninput="filterNews()" placeholder="Search news..."></div>
    <div class="filter-chips">
      <button class="chip active" onclick="setFilter(this,'all')">All</button>
      <button class="chip" onclick="setFilter(this,'mental')">Mental Health</button>
      <button class="chip" onclick="setFilter(this,'community')">Community</button>
      <button class="chip" onclick="setFilter(this,'forest')">Forest</button>
    </div>
  </div>
  <div id="newsGrid" class="news-grid"></div>
</div>

<div id="newsModal" class="news-modal" onclick="if(event.target===this) closeModal()">
  <div class="news-modal-card">
    <button class="modal-close" onclick="closeModal()">✕ Close</button>
    <img id="modalThumb" class="modal-thumb" style="display:none">
    <div id="modalPlaceholder" class="news-thumb-placeholder" style="height:220px">🌲</div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span id="modalBadge" class="badge badge-green">PUBLISHED</span><span id="modalDate" style="font-size:11px;color:#8A96A4"></span></div>
      <h2 id="modalTitle" class="serif" style="font-size:28px;margin:0 0 14px;line-height:1.1;color:#1A2E22"></h2>
      <p id="modalContent" style="white-space:pre-wrap;line-height:1.8;color:#425A4F;font-size:13.5px"></p>
      <div style="margin-top:18px;display:flex;gap:10px"><button class="btn-kain btn-gold" onclick="shareNews()">Share 🌿</button><button class="btn-kain btn-ghost" style="border-color:rgba(33,75,56,.2);color:#1A2E22" onclick="closeModal()">Close</button></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyCjYzrOvJuV1UN67aljAHQEK5LWCmtvMPw",authDomain:"payapang-isip.firebaseapp.com",projectId:"payapang-isip",storageBucket:"payapang-isip.firebasestorage.app",messagingSenderId:"901078398408",appId:"1:901078398408:web:1f4c5e5794f96801f57cfd"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const FALLBACK = "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800";
function cleanImage(u){ if(!u) return ""; u=String(u).trim(); if(u.startsWith("data:")) return ""; if(u.includes("bing.net")||u.includes("...")||u.length<15) return ""; if(!u.startsWith("http")) return ""; return u; }
let allNews=[];let currentFilter="all";let searchTerm="";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtDate(ts){if(!ts) return "Just now";try{const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"})+" • "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}catch{return "—"}}
function renderNews(){
  const grid=document.getElementById("newsGrid");
  let filtered=allNews.filter(n=>{
    const matchesSearch=!searchTerm || (n.title||"").toLowerCase().includes(searchTerm) || (n.content||"").toLowerCase().includes(searchTerm);
    const matchesFilter=currentFilter==="all" || (n.category||"").toLowerCase().includes(currentFilter);
    return matchesSearch && matchesFilter;
  });
  if(!filtered.length){ grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px 20px;background:#fff;border-radius:18px">Wala pang news. Mag-add sa Admin.</div>`; return; }
  grid.innerHTML=filtered.map(n=>{
    const img=cleanImage(n.image||n.media||"");
    return `<div class="news-card" onclick="openNews('${n.id}')">${img?`<img class="news-thumb" src="${esc(img)}" onerror="this.style.display='none'">`:`<div class="news-thumb-placeholder">🌲</div>`}<div class="news-body"><div class="news-meta"><span class="badge badge-green">${esc((n.status||'PUBLISHED').toUpperCase())}</span> • ${esc(fmtDate(n.createdAt))}</div><h3>${esc(n.title||'Untitled')}</h3><p>${esc((n.content||'').slice(0,140))}...</p><div class="news-foot"><span><b>${esc(n.author||'Payapang Isip')}</b> • ${n.views||0} views</span><span style="color:#D4A259;font-weight:800">Read →</span></div></div></div>`;
  }).join("");
}
window.setFilter=(btn,filter)=>{document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));btn.classList.add("active");currentFilter=filter;renderNews();}
window.filterNews=()=>{searchTerm=document.getElementById("searchInput").value.toLowerCase().trim();renderNews();}
const newsQuery=query(collection(db,"news"), orderBy("createdAt","desc"), limit(50));
onSnapshot(newsQuery, snap=>{
  if(snap.empty){ allNews=[{id:"demo1",title:"Mental Health Tips 🌿",content:"3 tips: Huminga, maglakad, magpasalamat. Payapa lang!",category:"mental",status:"published",author:"Payapang Isip",views:1240,createdAt:new Date(),image:""}]; renderNews(); return; }
  allNews=snap.docs.map(d=>({id:d.id,...d.data()})); renderNews();
});
window.openNews=(id)=>{
  const n=allNews.find(x=>x.id===id); if(!n) return;
  document.getElementById("modalTitle").textContent=n.title||"Untitled";
  document.getElementById("modalContent").textContent=n.content||"";
  document.getElementById("modalDate").textContent=fmtDate(n.createdAt);
  document.getElementById("modalBadge").textContent=(n.status||"PUBLISHED").toUpperCase();
  const thumb=document.getElementById("modalThumb"); const ph=document.getElementById("modalPlaceholder");
  const img=cleanImage(n.image||n.media||"");
  if(img){ thumb.src=img; thumb.style.display="block"; ph.style.display="none"; }else{ thumb.style.display="none"; ph.style.display="grid"; }
  document.getElementById("newsModal").classList.add("show"); document.body.style.overflow="hidden";
}
window.closeModal=()=>{document.getElementById("newsModal").classList.remove("show");document.body.style.overflow="";}
window.shareNews=()=>{ if(navigator.share){navigator.share({title:document.getElementById("modalTitle").textContent,url:location.href})} else{navigator.clipboard.writeText(location.href).then(()=>alert("Link copied! 🌿"))} }
</script>
</body>
</html>
