1. Breathe with the canopy: Inhale for 4, hold for 4, exhale for 6 under tall trees. The phytoncides released by forest leaves naturally calm your nervous system.

2. Leave your phone in your pocket. Let your eyes follow light through leaves, not screens.

3. Touch bark, moss, soil. Grounding reconnects you to the present.

4. Journal after. Write 3 sounds you heard, 2 smells, 1 feeling.

5. Return weekly. Consistency builds resilience, not intensity.

Our community walks every Sunday 6AM in La Mesa. Free, quiet, no small talk required.`,category:"Mental Health",status:"featured",image:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80&auto=format&fit=crop",createdAt:new Date(Date.now()-93600000),author:"Ate Lina",readTime:"4 min"},{id:"n2",title:"Community Guidelines: Keeping Our Forest Safe & Kind",excerpt:"Payapang Isip is a soft space. Here’s how we protect peace for everyone who enters.",content:`Welcome, kapwa. This is a gentle reminder of our shared agreements:

• No fixing, just witnessing. We listen, we don't advise unless asked.

• Zero tolerance for hate, medical diagnosis, or spam. We remove unkindness quickly.

• Forest images only. We keep visuals pure nature — no people, no text-heavy memes, to reduce trigger load.

• Confidentiality: What is shared in circles stays in circles.

• If you're in crisis, tap 'Huminga' on the homepage or call 1553. You are not alone.

Our moderators are volunteers trained in Psychological First Aid. If a post worries you, please report quietly.

Salamat for helping us keep this a payapang space.`,category:"Community",status:"published",image:"https://images.unsplash.com/photo-1473448912268-2022ce9509d8?w=800&q=80&auto=format&fit=crop",createdAt:new Date(Date.now()-259200000),author:"Payapang Team",readTime:"3 min"},{id:"n3",title:"Featured Whisper: The Sound of Morning Mist",excerpt:"A 12-minute forest soundscape recorded at 5:30AM in Tanay — best heard with eyes closed.",content:`This week’s featured whisper was recorded by Kuya Jun after a night of rain. You’ll hear tikling birds, distant water, and wind moving through anahaw leaves.

Why we love it: Research shows natural soundscapes reduce anxiety faster than silence. Try playing this while doing your morning pahinga ritual.

How to use:
1. Sit near a window
2. Close your eyes
3. Let the recording play once, without multitasking
4. Notice where in your body you feel calmest afterward

Link to full audio is in our Forest Library. No account needed, just press play.

If this brought you even 2% more peace today, share it with one person who needs it.`,category:"Forest Whispers",status:"published",image:"https://images.unsplash.com/photo-1425913397330-cf8af2ff40a1?w=800&q=80&auto=format&fit=crop",createdAt:new Date(Date.now()-432000000),author:"Field Recordings",readTime:"2 min"},{id:"n4",title:"New Circle: Linggo ng Paghinga Every Sunday",excerpt:"Free breathing circles under acacia trees — no experience needed, just arrive.",content:"Starting this November, every Sunday 6AM at QC Circle. Bring a banig, water, and an open heart. Facilitated by volunteers.",category:"Announcement",status:"published",image:"https://images.unsplash.com/photo-1510780771204-8dfe6d1c6c4a?w=800&q=80&auto=format&fit=crop",createdAt:new Date(Date.now()-720000000),author:"Circles Team",readTime:"1 min"},{id:"n5",title:"Roots & Resilience: Why Trees Remember",excerpt:"What old narra trees teach us about holding on and letting go at the same time.",content:"A reflection on intergenerational resilience...",category:"Mental Health",status:"published",image:"https://images.unsplash.com/photo-1448375240586-882707db888b?w=800&q=80&auto=format&fit=crop",createdAt:new Date(Date.now()-1080000000),author:"Dr. Maya",readTime:"5 min"},{id:"n6",title:"Rain Journal Prompt #07",excerpt:"If the rain could wash one worry away today, what would you let it take?",content:"A gentle journaling exercise...",category:"Forest Whispers",status:"published",image:"https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=800&q=80&auto=format&fit=crop",createdAt:new Date(Date.now()-1440000000),author:"Whispers",readTime:"2 min"}],C0=["All","Mental Health","Community","Forest Whispers","Announcement"];function ei(){let[e,n]=Le.useState(""),[t,r]=Le.useState("All"),[l,o]=Le.useState(null),[u,i]=Le.useState(null),[s,f]=Le.useState(!1);Le.useEffect(()=>{document.title="Payapang Isip • News & Forest Whispers \uD83C\uDF32 LOCKED v1.0"},[]),Le.useEffect(()=>{let p=(w)=>{if(w.key==="Esc
